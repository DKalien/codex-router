name: CI

on:
  push:
    branches: [lite]
  pull_request:
    branches: [lite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate provider registry
        run: node --input-type=module -e "await import('./src/model-registry.mjs')"
      # Run every .mjs test explicitly; their filenames do not use Node's
      # default *.test.mjs pattern. Serial files avoid competing ACL helpers
      # and startup probes on Windows runners. No provider secrets required.
      - name: Run regression tests
        run: npm test
